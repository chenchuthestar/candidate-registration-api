# ===== JPA / Hibernate =====
# 'update' auto-creates/updates tables from the entities below.
# Switch to 'validate' once your schema is stable in a real environment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== CORS (handled in code via WebConfig, kept here for reference) =====
